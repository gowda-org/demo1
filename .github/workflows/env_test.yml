name: Environment Test

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.generate_plan.outputs.plan }}
    steps:
      - id: generate_plan
        run: echo "plan=..." >> "$GITHUB_OUTPUT"

  implement:
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Print plan
        run: echo "Using plan: ${{ needs.plan.outputs.plan }}"
