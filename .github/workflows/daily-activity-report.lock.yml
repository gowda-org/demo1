name: Daily Activity Report (Agentic lock)

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:

permissions:  
  contents: read
  issues: write
  pull-requests: read
jobs:
  create-report:
    name: Create daily activity report and open issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and create daily activity issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const since = new Date(Date.now() - 24*60*60*1000).toISOString();

            // Fetch commits since `since`
            const commitsResp = await github.rest.repos.listCommits({ owner, repo, since, per_page: 100 });
            const commits = commitsResp.data || [];

            // Fetch issues (includes PRs via pull_request field) updated since `since`
            const issuesResp = await github.rest.issues.listForRepo({ owner, repo, since, state: 'all', per_page: 100 });
            const issuesAll = issuesResp.data || [];

            // Fetch pulls and filter by updated_at
            const pullsResp = await github.rest.pulls.list({ owner, repo, state: 'all', per_page: 100 });
            const pullsAll = pullsResp.data || [];

            const sinceDate = new Date(since);
            const prs = pullsAll.filter(p => new Date(p.updated_at) >= sinceDate);
            const issues = issuesAll.filter(i => !i.pull_request && new Date(i.updated_at) >= sinceDate);

            function shortCommitLine(c){
              const sha = c.sha.substring(0,7);
              const msg = c.commit && c.commit.message ? c.commit.message.split('\n')[0] : '';
              const author = (c.author && c.author.login) || (c.commit && c.commit.author && c.commit.author.name) || 'unknown';
              return `- [${sha}](https://github.com/${owner}/${repo}/commit/${c.sha}) ${msg} — @${author}`;
            }

            let body = `## Daily Activity Report (${new Date().toISOString().slice(0,10)})\n\n**Since:** ${since}\n\n`;

            body += `**Commits:** ${commits.length}\n\n`;
            if (commits.length){
              body += `### Commits\n`;
              for (const c of commits.slice(0,50)){
                body += `${shortCommitLine(c)}\n`;
              }
              body += `\n`;
            }

            body += `**Pull requests updated:** ${prs.length}\n\n`;
            if (prs.length){
              body += `### Pull Requests\n`;
              for (const p of prs.slice(0,50)){
                body += `- [#${p.number} ${p.title}](${p.html_url}) — ${p.user && p.user.login} (${p.state})\n`;
              }
              body += `\n`;
            }

            body += `**Issues updated:** ${issues.length}\n\n`;
            if (issues.length){
              body += `### Issues\n`;
              for (const i of issues.slice(0,50)){
                body += `- [#${i.number} ${i.title}](${i.html_url}) — ${i.user && i.user.login} (${i.state})\n`;
              }
              body += `\n`;
            }

            body += `---\n_Report generated by an automated workflow._`;

            const title = `Daily activity report — ${new Date().toISOString().slice(0,10)}`;

            await github.rest.issues.create({ owner, repo, title, body });
